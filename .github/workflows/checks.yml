name: Handbook checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install -c requirements.lock -e '.[dev]'
      - run: npm test
      - run: python -m pytest -q
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser checks
        run: |
          python -m uvicorn ml_handbook.api:app --host 127.0.0.1 --port 8000 &
          npm start &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/en >/dev/null && curl -fsS http://127.0.0.1:8000/health >/dev/null; then break; fi
            sleep 1
          done
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: test-results/
