[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-handbook"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "scipy>=1.14,<2", "scikit-learn>=1.5,<2", "statsmodels>=0.14,<0.15", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
legacy = ["streamlit>=1.40,<2", "plotly>=6,<8", "matplotlib>=3.9,<4", "pandas>=2.2,<3"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["python"]
